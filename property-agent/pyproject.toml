[project]
name = "pivotal-property-engine"
version = "0.1.0"
description = "Property agent for Pivotal Real Estate's Property Analysis Template: button service + Claude app plug-in."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "anthropic>=2.3,<3",
    "fastapi>=0.162,<1",
    "uvicorn>=0.54,<1",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "openpyxl>=3.1"]

[project.scripts]
pivotal-engine = "pivotal_engine.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: calls the real King County website (skipped unless --live is given)"]
